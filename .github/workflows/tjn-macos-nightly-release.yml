name: TJN macOS Nightly Release

on:
  schedule:
    # Keep a periodic fallback in case a workflow_run event is delayed.
    - cron: "37 */3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - TJN Sync Upstream Source
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: tjn-macos-nightly-release
  cancel-in-progress: false

jobs:
  publish:
    # This workflow is fork-specific and must never publish from upstream.
    if: >-
      github.repository == 'travisjneuman/t3code' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out the fork default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip scheduled release when main has not changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_nightly_tag=$(git tag --list 'v*-nightly.*' 'nightly-v*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "No previous nightly tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(git rev-parse "$last_nightly_tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            echo "No changes on main since last nightly release ($last_nightly_tag). Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected since $last_nightly_tag. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Vite+
        if: steps.changes.outputs.has_changes == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Resolve Nightly metadata
        if: steps.changes.outputs.has_changes == 'true'
        id: release_meta
        shell: bash
        env:
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          nightly_date="$(date -u +%Y%m%d)"
          nightly_run_number="$(date -u +%H%M)"
          while [[ "$nightly_run_number" == 0* && "$nightly_run_number" != "0" ]]; do
            nightly_run_number="${nightly_run_number#0}"
          done
          if [[ "$nightly_run_number" == "0" ]]; then
            nightly_run_number=1
          fi
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$nightly_run_number" \
            --sha "$NIGHTLY_SHA" \
            --github-output

      - name: Align package versions to the release version
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - name: Build macOS ARM64 package
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          vp run --filter @t3tools/desktop ensure:electron
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.release_meta.outputs.version }}"

      - name: Publish fork Nightly release
        if: steps.changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          token: ${{ github.token }}

      - name: Remove superseded fork Nightly releases and tags
        if: steps.changes.outputs.has_changes == 'true'
        env:
          CURRENT_TAG: ${{ steps.release_meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$CURRENT_TAG" ]] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName \
              --jq '.[].tagName' \
              | grep -E '^(v[0-9]+\.[0-9]+\.[0-9]+-nightly\.|nightly-v)'
          )

          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$CURRENT_TAG" ]] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
              --paginate \
              --jq '.[].name' \
              | grep -E '^(v[0-9]+\.[0-9]+\.[0-9]+-nightly\.|nightly-v)'
          )
