name: TJN Sync Upstream Source

on:
  schedule:
    # GitHub schedules are best-effort. Five minutes is the shortest supported
    # polling interval for Actions, so this minimizes fork drift without an
    # upstream webhook or app installation.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tjn-upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    # This workflow is intentionally fork-specific. It must never try to sync
    # the upstream repository to itself if the file is ever copied upstream.
    if: github.repository == 'travisjneuman/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the fork default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream main without dropping TJN commits
        env:
          UPSTREAM_REPOSITORY: pingdotgg/t3code
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream main."
            exit 0
          fi

          # A normal merge preserves the custom ChatGPT surface commits. A
          # conflict fails this run before push, so custom code is never
          # replaced by a destructive hard reset.
          fork_head="$(git rev-parse HEAD)"
          git merge --no-edit --no-ff upstream/main -m "chore(sync): merge upstream main"

          # The fork owns its workflow directory. GitHub's GITHUB_TOKEN is
          # intentionally unable to push upstream changes to workflow files,
          # so restore the fork-managed workflows before pushing the merge.
          # Application and documentation changes from upstream are still
          # merged normally; only CI/release automation stays fork-specific.
          git restore --source="$fork_head" --staged --worktree -- .github/workflows
          git commit --amend --no-edit
          git push origin HEAD:main
